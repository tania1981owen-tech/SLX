name: Automated Windows Solution Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # Устанавливаем библиотеки через vcpkg
    - name: Install Dependencies via vcpkg
      run: |
        vcpkg install yaml-cpp:x86-windows
        vcpkg install cryptopp:x86-windows
        vcpkg integrate install

    - name: Restore NuGet Packages
      run: nuget restore alx.sln

    # [ИСПРАВЛЕНО] Добавлены флаги /p:UseVcpkgIntegration=true и /p:VcpkgEnableManifest=true, 
    # которые принудительно перебивают жесткие локальные пути "Auscar" внутри vcxproj.
    # Также добавлен автоматический обход ошибок инклудов через глобальные переменные инжекта библиотек.
    - name: Compile Solution
      run: |
        msbuild alx.sln /t:Rebuild /p:Configuration=Release /p:Platform="Win32" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:UseVcpkgIntegration=true /p:VcpkgEnableManifest=true /p:VcpkgTriplet=x86-windows /p:IncludePath="C:\vcpkg\installed\x86-windows\include;$(IncludePath)" /p:LibraryPath="C:\vcpkg\installed\x86-windows\lib;$(LibraryPath)"

    # Сохраняем готовую DLL-ку
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          Release/*.dll
          Release/*.exe
          **/Release/*.dll
          **/Release/*.exe
