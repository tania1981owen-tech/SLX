name: Automated Windows Solution Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # 1. Устанавливаем yaml-cpp через vcpkg
    - name: Install yaml-cpp via vcpkg
      run: |
        vcpkg install yaml-cpp:x86-windows
        vcpkg integrate install

    # 2. Скачиваем и собираем Crypto++ 5.6.2 с SourceForge
    - name: Download and Build Crypto++ 5.6.2
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"

        $url = "https://sourceforge.net/projects/cryptopp/files/cryptopp/5.6.2/cryptopp562.zip/download"
        $zip = "$env:TEMP\cryptopp562.zip"
        $extract = "$env:TEMP\cryptopp562"

        Write-Host "=== Шаг 1: Скачивание ==="
        try {
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 5
          Write-Host "OK, размер файла: $((Get-Item $zip).Length) байт"
        } catch {
          Write-Host "ОШИБКА скачивания: $_"
          exit 1
        }

        Write-Host "=== Шаг 2: Распаковка ==="
        Expand-Archive -Path $zip -DestinationPath $extract -Force
        Write-Host "OK, содержимое папки:"
        Get-ChildItem $extract | Select-Object Name

        Write-Host "=== Шаг 3: Поиск cryptlib.vcxproj ==="
        $proj = Get-ChildItem -Path $extract -Recurse -Filter "cryptlib.vcxproj" | Select-Object -First 1
        if (-not $proj) {
          Write-Host "cryptlib.vcxproj НЕ НАЙДЕН. Ищем все .vcxproj:"
          Get-ChildItem -Path $extract -Recurse -Filter "*.vcxproj" | Select-Object FullName
          exit 1
        }
        Write-Host "Найден: $($proj.FullName)"

        Write-Host "=== Шаг 4: Сборка ==="
        $msbuildOutput = msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal 2>&1
        $msbuildOutput | Write-Host

        Write-Host "=== Шаг 5: Поиск cryptlib.lib ==="
        $lib = Get-ChildItem -Path $extract -Recurse -Filter "cryptlib.lib" | Select-Object -First 1
        if (-not $lib) {
          Write-Host "cryptlib.lib НЕ НАЙДЕН. Ищем все .lib:"
          Get-ChildItem -Path $extract -Recurse -Filter "*.lib" | Select-Object FullName
          exit 1
        }
        Write-Host "Найден: $($lib.FullName)"

        $targetDir = "C:\Users\Auscar\Documents\Programming\libraries\cryptopp562\Win32\Output\Release"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        Copy-Item $lib.FullName "$targetDir\cryptlib.lib" -Force
        Write-Host "cryptlib.lib размещён в $targetDir"

    - name: Restore NuGet Packages
      run: nuget restore alx.sln

    # 3. Запуск сборки решения
    - name: Compile Solution
      run: |
        msbuild alx.sln /t:Rebuild /p:Configuration=Release /p:Platform="Win32" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:UseVcpkgIntegration=true /p:VcpkgEnableManifest=false /p:VcpkgTriplet=x86-windows

    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          alx/Release/*.dll
          Release/*.dll
          **/Release/*.dll
