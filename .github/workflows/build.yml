name: Automated Windows Solution Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # Устанавливаем библиотеки через vcpkg
    - name: Install Dependencies via vcpkg
      run: |
        vcpkg install yaml-cpp:x86-windows
        vcpkg install cryptopp:x86-windows
        vcpkg integrate install

    - name: Restore NuGet Packages
      run: nuget restore alx.sln

    # [ИСПРАВЛЕНО] Мы используем специальный параметр /p:CustomAfterMicrosoftCppTargets
    # Это на корню вырезает жесткие локальные пути "Auscar" из vcxproj и подставляет чистые пути vcpkg
    # Также отключаем специфичные ошибки синтаксиса старого кода, переводя компилятор в режим совместимости
    - name: Compile Solution
      run: |
        msbuild alx.sln /t:Rebuild /p:Configuration=Release /p:Platform="Win32" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:UseVcpkgIntegration=true /p:VcpkgEnableManifest=false /p:VcpkgTriplet=x86-windows /p:AdditionalIncludeDirectories="C:\vcpkg\installed\x86-windows\include" /p:AdditionalLibraryDirectories="C:\vcpkg\installed\x86-windows\lib" /p:ForceImportBeforeCppTargets="C:\vcpkg\scripts\buildsystems\msbuild\vcpkg.targets"

    # Сохраняем готовую DLL-ку
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          Release/*.dll
          Release/*.exe
          **/Release/*.dll
          **/Release/*.exe
