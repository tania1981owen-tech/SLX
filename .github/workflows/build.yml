name: Automated Windows Solution Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # 1. Устанавливаем ТОЛЬКО yaml-cpp через vcpkg (он собирается нормально)
    - name: Install yaml-cpp via vcpkg
      run: |
        vcpkg install yaml-cpp:x86-windows
        vcpkg integrate install

    # 2. Скачиваем готовый cryptlib.lib (Crypto++ 5.6.2, Win32, Release)
    - name: Download prebuilt cryptlib.lib
      shell: pwsh
      run: |
        $url = "https://github.com/weidai11/cryptopp/releases/download/CRYPTOPP_5_6_2/cryptopp562.zip"
        $zip = "$env:TEMP\cryptopp562.zip"
        $extract = "$env:TEMP\cryptopp562"
        
        Write-Host "Скачиваем Crypto++ 5.6.2..."
        Invoke-WebRequest -Uri $url -OutFile $zip
        
        Write-Host "Распаковываем..."
        Expand-Archive -Path $zip -DestinationPath $extract -Force
        
        # Ищем cryptlib.lib в распакованных файлах
        $lib = Get-ChildItem -Path $extract -Recurse -Filter "cryptlib.lib" | Select-Object -First 1
        
        if (-not $lib) {
          Write-Host "cryptlib.lib не найден в архиве. Смотрим содержимое:"
          Get-ChildItem -Path $extract -Recurse | Select-Object FullName
          exit 1
        }
        
        Write-Host "Найден: $($lib.FullName)"
        
        # Кладём туда, где его ждёт старый проект
        $targetDir = "C:\Users\Auscar\Documents\Programming\libraries\cryptopp562\Win32\Output\Release"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        Copy-Item $lib.FullName "$targetDir\cryptlib.lib" -Force
        
        Write-Host "cryptlib.lib успешно размещён в $targetDir"

    - name: Restore NuGet Packages
      run: nuget restore alx.sln

    # 3. Запуск сборки решения
    - name: Compile Solution
      run: |
        msbuild alx.sln /t:Rebuild /p:Configuration=Release /p:Platform="Win32" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:UseVcpkgIntegration=true /p:VcpkgEnableManifest=false /p:VcpkgTriplet=x86-windows

    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          alx/Release/*.dll
          Release/*.dll
          **/Release/*.dll
