name: Automated Windows Solution Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Setup MSBuild Configuration
      uses: microsoft/setup-msbuild@v2

    # Чистая установка зависимостей в систему
    - name: Install Dependencies via vcpkg
      run: |
        vcpkg install yaml-cpp:x86-windows
        vcpkg install cryptopp:x86-windows
        vcpkg integrate install

    # Кладём cryptlib.lib туда, где его ищет старый проект (путь автора)
    - name: Place cryptlib.lib where project expects it
      shell: powershell
      run: |
        $targetDir = "C:\Users\Auscar\Documents\Programming\libraries\cryptopp562\Win32\Output\Release"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        Copy-Item "C:\vcpkg\installed\x86-windows\lib\cryptlib.lib" "$targetDir\cryptlib.lib" -Force
        Write-Host "cryptlib.lib placed at $targetDir"

    - name: Restore NuGet Packages
      run: nuget restore alx.sln

    # Запуск стандартной сборки решения
    - name: Compile Solution
      run: |
        msbuild alx.sln /t:Rebuild /p:Configuration=Release /p:Platform="Win32" /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:UseVcpkgIntegration=true /p:VcpkgEnableManifest=false /p:VcpkgTriplet=x86-windows

    # Сборщик забирает скомпилированную DLL-ку наружу
    - name: Save Compiled Files
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Program
        path: |
          alx/Release/*.dll
          Release/*.dll
          **/Release/*.dll
